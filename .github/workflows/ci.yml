name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # v4 of this action still declares a Node 20 runtime, which the runner now forces onto Node 24
      # and reports as a deprecation warning on every run (issue-level noise, not a failure). v6 is
      # the current major and takes the same `version` input.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      # CI resolves exactly the graph checked into pnpm-lock.yaml.
      - run: node -v
      - run: pnpm -v
      # Unit tests use fixture children and do not need an Electron binary.
      # Keep package lifecycle scripts disabled. Electron 44 downloads its binary
      # lazily on first require; discovery must remain a pure filesystem probe.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The test runner builds first and gives every test a marked, private installer boundary.
      - run: npm test
