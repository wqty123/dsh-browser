name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      # CI resolves exactly the graph checked into pnpm-lock.yaml.
      - run: node -v
      - run: pnpm -v
      # Unit tests use fixture children and do not need an Electron binary.
      # Keep package lifecycle scripts disabled. Electron 44 downloads its binary
      # lazily on first require; discovery must remain a pure filesystem probe.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: node --test "tests/*.test.mjs"
