# dsh-builtin-browser bundle patch: mounts the shared-browser capability into a
# profile composition. The browser seam (ctx.browser) is always mounted. The
# Electron provider and browser_* tools are ALWAYS registered: when the host
# provides `electronViewHost` (the desktop shell) that embedded view is used,
# and otherwise the plugin self-hosts its own Electron window, so installing
# the plugin is enough for the browser to work anywhere.
- insert:
    - id: browser
      name: dsh-builtin-browser/browser

    - id: browser-electron
      name: dsh-builtin-browser/browser-electron
      config:
        viewHost: !!js ctx.get('electronViewHost')

    - id: tool-browser
      name: dsh-builtin-browser/tool-browser
