# pnpm settings.
#
# Since pnpm 10, settings that used to live in package.json's "pnpm" field are
# read from this file instead — including `overrides`, which is why the same
# entry placed in package.json is silently ignored (pnpm prints a warning and
# resolves the original version).
#
# `undici` is a transitive dependency here: nothing in this plugin imports it
# (the tools use Node's built-in fetch, and the browser host speaks CDP over
# node:net). It still ends up in the dependency tree, so the resolution is pinned
# to a release carrying the later Agent TLS and fetch error-handling fixes,
# in addition to CVE-2026-84961. Pinned within the same major: nothing needs undici
# 8, and a major jump in a transitive dependency is a compatibility risk for no
# benefit.
overrides:
  undici: 7.30.1
